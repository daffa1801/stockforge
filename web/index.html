<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StockForge</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="view-gallery">
<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>StockForge</h1>
    <span id="profileBadge" class="badge">Akun -</span>
    <span id="statusPill" class="pill idle">idle</span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="gallery">Gambar</button>
    <button class="tab" data-view="log">Log</button>
  </nav>
  <div class="counters">
    <div><b id="cTotal">0</b><span>total</span></div>
    <div><b id="cGen">0</b><span>generate</span></div>
    <div><b id="cJudge">0</b><span>dinilai</span></div>
    <div><b id="cShort">0</b><span>lolos</span></div>
    <div><b id="cRej">0</b><span>dibuang</span></div>
  </div>
</header>

<section class="controls">
  <input id="sheetUrl" type="text" placeholder="Tempel link Google Spreadsheet harian di sini" />
  <button id="btnStart" class="primary">Mulai</button>
  <button id="btnPause">Jeda</button>
  <button id="btnResume">Lanjut</button>
  <button id="btnStop" class="danger">Stop</button>
  <select id="profileSelect"></select>
  <button id="btnProfile">Ganti Profil</button>
</section>

<div id="notice" class="notice hidden">
  <span id="noticeText"></span>
  <button id="noticeAction">Lanjut</button>
</div>

<div class="statusline">
  <span id="runMessage">Siap.</span>
  <span id="runCurrent" class="muted"></span>
  <label class="toggle"><input type="checkbox" id="onlyShort" /> hanya yang lolos</label>
</div>

<main id="concepts" class="view"></main>

<section id="viewLog" class="view logview hidden">
  <div class="logtop">
    <div class="logtitle">
      <h2>Log pekerjaan</h2>
      <span id="logSubtitle" class="muted"></span>
    </div>
    <div class="logtools">
      <input id="logSearch" type="text" placeholder="Cari file, konsep, atau pesan…" />
      <select id="logDay"></select>
      <a id="logDownload" class="btnlink" href="#">Unduh .jsonl</a>
    </div>
  </div>

  <div class="statrow" id="logStats"></div>
  <div class="filterrow" id="logFilters"></div>
  <div class="logbody" id="logBody"></div>
</section>

<script src="app.js"></script>
</body>
</html>
